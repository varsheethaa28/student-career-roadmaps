
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reset Password | CareerPath</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f8f8f8;
    }

    .container {
      width: 90%;
      max-width: 420px;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
    }

    h1 {
      text-align: center;
      color: #d90429;
      margin-bottom: 10px;
    }

    .description {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .step {
      display: none;
    }

    .step.active {
      display: block;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 20px;
      border: none;
      border-radius: 8px;
      background: #d90429;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background: #b80322;
    }

    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .message {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #d90429;
      text-decoration: none;
      font-size: 14px;
    }

    .otp-input {
      text-align: center;
      letter-spacing: 8px;
      font-size: 22px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>CareerPath</h1>

    <p class="description">
      Reset your password securely using a 6-digit OTP.
    </p>

    <!-- STEP 1: ENTER EMAIL -->
    <div class="step active" id="step1">

      <h3>Forgot Password?</h3>

      <label for="email">Registered Email</label>

      <input
        type="email"
        id="email"
        placeholder="Enter your registered email"
        required
      >

      <button id="sendOtpButton">
        Send OTP
      </button>

    </div>

    <!-- STEP 2: VERIFY OTP -->
    <div class="step" id="step2">

      <h3>Verify OTP</h3>

      <p class="description">
        Enter the 6-digit OTP sent to your email.
      </p>

      <label for="otp">6-Digit OTP</label>

      <input
        type="text"
        id="otp"
        class="otp-input"
        placeholder="000000"
        maxlength="6"
        inputmode="numeric"
        required
      >

      <button id="verifyOtpButton">
        Verify OTP
      </button>

      <button
        id="backToEmailButton"
        style="background: #555;"
      >
        Back
      </button>

    </div>

    <!-- STEP 3: NEW PASSWORD -->
    <div class="step" id="step3">

      <h3>Create New Password</h3>

      <label for="newPassword">New Password</label>

      <input
        type="password"
        id="newPassword"
        placeholder="Enter new password"
        minlength="6"
        required
      >

      <label for="confirmPassword">Confirm Password</label>

      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm new password"
        minlength="6"
        required
      >

      <button id="resetPasswordButton">
        Reset Password
      </button>

    </div>

    <p class="message" id="message"></p>

    <a href="login.html" class="back-link">
      Back to Login
    </a>

  </div>

  <script>

    const API_URL = "http://localhost:5000";

    let userEmail = "";
    let resetToken = "";

    const step1 = document.getElementById("step1");
    const step2 = document.getElementById("step2");
    const step3 = document.getElementById("step3");

    const emailInput = document.getElementById("email");
    const otpInput = document.getElementById("otp");
    const newPasswordInput = document.getElementById("newPassword");
    const confirmPasswordInput = document.getElementById("confirmPassword");

    const sendOtpButton = document.getElementById("sendOtpButton");
    const verifyOtpButton = document.getElementById("verifyOtpButton");
    const resetPasswordButton = document.getElementById("resetPasswordButton");
    const backToEmailButton = document.getElementById("backToEmailButton");

    const message = document.getElementById("message");

    function showMessage(text, success = false) {
      message.textContent = text;
      message.style.color = success ? "green" : "#d90429";
    }

    function showStep(stepNumber) {
      step1.classList.remove("active");
      step2.classList.remove("active");
      step3.classList.remove("active");

      if (stepNumber === 1) {
        step1.classList.add("active");
      }

      if (stepNumber === 2) {
        step2.classList.add("active");
      }

      if (stepNumber === 3) {
        step3.classList.add("active");
      }
    }

    // STEP 1: SEND OTP
    sendOtpButton.addEventListener("click", async () => {

      userEmail = emailInput.value.trim();

      if (!userEmail) {
        showMessage("Please enter your email address.");
        return;
      }

      sendOtpButton.disabled = true;
      sendOtpButton.textContent = "Sending...";

      try {

        const response = await fetch(
          `${API_URL}/api/auth/request-reset`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              email: userEmail
            })
          }
        );

        const data = await response.json();

        if (!response.ok || data.success === false) {
          throw new Error(data.message || "Unable to send OTP.");
        }

        showMessage(
          "OTP sent successfully. Check your email.",
          true
        );

        showStep(2);

      } catch (error) {

        console.error(error);
        showMessage(error.message);

      } finally {

        sendOtpButton.disabled = false;
        sendOtpButton.textContent = "Send OTP";

      }

    });

    // STEP 2: VERIFY OTP
    verifyOtpButton.addEventListener("click", async () => {

      const otp = otpInput.value.trim();

      if (!/^\d{6}$/.test(otp)) {
        showMessage("Please enter a valid 6-digit OTP.");
        return;
      }

      verifyOtpButton.disabled = true;
      verifyOtpButton.textContent = "Verifying...";

      try {

        const response = await fetch(
          `${API_URL}/api/auth/verify-reset-otp`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              email: userEmail,
              otp: otp
            })
          }
        );

        const data = await response.json();

        if (!response.ok || data.success === false) {
          throw new Error(data.message || "Invalid OTP.");
        }

        resetToken =
          data.resetToken ||
          (data.data && data.data.resetToken);

        if (!resetToken) {
          throw new Error(
            "OTP verified, but reset token was not received."
          );
        }

        showMessage(
          "OTP verified successfully.",
          true
        );

        showStep(3);

      } catch (error) {

        console.error(error);
        showMessage(error.message);

      } finally {

        verifyOtpButton.disabled = false;
        verifyOtpButton.textContent = "Verify OTP";

      }

    });

    // BACK TO EMAIL
    backToEmailButton.addEventListener("click", () => {

      showStep(1);
      showMessage("");

    });

    // STEP 3: RESET PASSWORD
    resetPasswordButton.addEventListener("click", async () => {

      const newPassword = newPasswordInput.value;
      const confirmPassword = confirmPasswordInput.value;

      if (newPassword.length < 6) {
        showMessage(
          "Password must contain at least 6 characters."
        );
        return;
      }

      if (newPassword !== confirmPassword) {
        showMessage("Passwords do not match.");
        return;
      }

      resetPasswordButton.disabled = true;
      resetPasswordButton.textContent = "Resetting...";

      try {

        const response = await fetch(
          `${API_URL}/api/auth/reset-password`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              email: userEmail,
              resetToken: resetToken,
              newPassword: newPassword
            })
          }
        );

        const data = await response.json();

        if (!response.ok || data.success === false) {
          throw new Error(data.message || "Password reset failed.");
        }

        showMessage(
          "Password reset successfully! Redirecting to login...",
          true
        );

        setTimeout(() => {
          window.location.href = "login.html";
        }, 2000);

      } catch (error) {

        console.error(error);
        showMessage(error.message);

      } finally {

        resetPasswordButton.disabled = false;
        resetPasswordButton.textContent = "Reset Password";

      }

    });

  </script>

</body>
</html>
