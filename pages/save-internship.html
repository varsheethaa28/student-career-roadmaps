
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Save Internship | CareerPath</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #fff5f6;
            color: #333;
        }

        header {
            background: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            color: #d90429;
        }

        nav {
            display: flex;
            gap: 18px;
            align-items: center;
        }

        nav a {
            text-decoration: none;
            color: #333;
            font-size: 14px;
        }

        nav a:hover {
            color: #d90429;
        }

        .dashboard-btn {
            background: #d90429;
            color: white !important;
            padding: 10px 15px;
            border-radius: 20px;
        }

        .page-container {
            max-width: 700px;
            margin: 45px auto;
            padding: 0 20px;
        }

        .heading {
            text-align: center;
            margin-bottom: 25px;
        }

        .heading h1 {
            color: #d90429;
            font-size: 34px;
            margin-bottom: 10px;
        }

        .heading p {
            color: #666;
            line-height: 1.5;
        }

        .form-card {
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.07);
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: bold;
            color: #444;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #d90429;
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        .required {
            color: #d90429;
        }

        .save-btn {
            width: 100%;
            padding: 14px;
            background: #d90429;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .save-btn:hover {
            background: #b80322;
        }

        .save-btn:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        .message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            line-height: 1.5;
        }

        .success {
            color: green;
        }

        .error {
            color: #d90429;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #d90429;
            text-decoration: none;
            font-size: 14px;
        }

        footer {
            text-align: center;
            background: #d90429;
            color: white;
            padding: 22px;
            margin-top: 40px;
            font-size: 14px;
        }

        @media (max-width: 600px) {

            header {
                flex-direction: column;
                gap: 15px;
            }

            nav {
                flex-wrap: wrap;
                justify-content: center;
            }

            .heading h1 {
                font-size: 28px;
            }

            .form-card {
                padding: 22px;
            }

        }

    </style>

</head>

<body>

    <!-- HEADER -->

    <header>

        <div class="logo">
            CareerPath
        </div>

        <nav>

            <a href="../frontend/index.html">
                Home
            </a>

            <a href="roadmap.html">
                Roadmaps
            </a>

            <a href="internships.html">
                Internships
            </a>

            <a href="dashboard.html">
                Dashboard
            </a>

        </nav>

    </header>


    <!-- PAGE CONTENT -->

    <main class="page-container">

        <div class="heading">

            <h1>Save an Internship 💼</h1>

            <p>
                Save an interesting opportunity and track your
                application journey in CareerPath.
            </p>

        </div>


        <!-- FORM -->

        <div class="form-card">

            <form id="internshipForm">

                <!-- TITLE -->

                <div class="form-group">

                    <label for="title">
                        Internship Role <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        id="title"
                        placeholder="Example: Frontend Developer Intern"
                        required
                    >

                </div>


                <!-- COMPANY -->

                <div class="form-group">

                    <label for="company">
                        Company Name <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        id="company"
                        placeholder="Example: ABC Technologies"
                        required
                    >

                </div>


                <!-- LOCATION -->

                <div class="form-group">

                    <label for="location">
                        Location
                    </label>

                    <input
                        type="text"
                        id="location"
                        placeholder="Example: Chennai, Remote, Bengaluru"
                    >

                </div>


                <!-- WORK MODE -->

                <div class="form-group">

                    <label for="workMode">
                        Work Mode
                    </label>

                    <select id="workMode">

                        <option value="Not Specified">
                            Not Specified
                        </option>

                        <option value="Remote">
                            Remote
                        </option>

                        <option value="Onsite">
                            Onsite
                        </option>

                        <option value="Hybrid">
                            Hybrid
                        </option>

                    </select>

                </div>


                <!-- STIPEND -->

                <div class="form-group">

                    <label for="stipend">
                        Stipend
                    </label>

                    <input
                        type="text"
                        id="stipend"
                        placeholder="Example: ₹10,000/month or Unpaid"
                    >

                </div>


                <!-- APPLICATION LINK -->

                <div class="form-group">

                    <label for="applicationLink">
                        Application Link <span class="required">*</span>
                    </label>

                    <input
                        type="url"
                        id="applicationLink"
                        placeholder="https://example.com/internship"
                        required
                    >

                </div>


                <!-- DEADLINE -->

                <div class="form-group">

                    <label for="deadline">
                        Application Deadline
                    </label>

                    <input
                        type="date"
                        id="deadline"
                    >

                </div>


                <!-- STATUS -->

                <div class="form-group">

                    <label for="status">
                        Application Status
                    </label>

                    <select id="status">

                        <option value="Saved">
                            Saved
                        </option>

                        <option value="Applied">
                            Applied
                        </option>

                        <option value="Shortlisted">
                            Shortlisted
                        </option>

                        <option value="Rejected">
                            Rejected
                        </option>

                    </select>

                </div>


                <!-- NOTES -->

                <div class="form-group">

                    <label for="notes">
                        Notes
                    </label>

                    <textarea
                        id="notes"
                        placeholder="Add your notes, required skills, or preparation details..."
                    ></textarea>

                </div>


                <!-- SUBMIT -->

                <button
                    type="submit"
                    class="save-btn"
                    id="saveButton"
                >
                    Save Internship 💾
                </button>

                <div
                    id="message"
                    class="message"
                ></div>

            </form>

        </div>


        <a
            href="internships.html"
            class="back-link"
        >
            ← Back to Internship Hub
        </a>

    </main>


    <!-- FOOTER -->

    <footer>

        <p>
            © 2026 CareerPath | Build Your Future 🚀
        </p>

    </footer>


    <!-- FIREBASE SCRIPT -->

    <script type="module">

        import {
            auth,
            db
        } from "../frontend/firebase-config.js";

        import {
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        import {
            collection,
            addDoc,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


        const form = document.getElementById("internshipForm");

        const saveButton = document.getElementById("saveButton");

        const message = document.getElementById("message");

        let currentUser = null;


        // Check whether the student is logged in

        onAuthStateChanged(auth, (user) => {

            if (user) {

                currentUser = user;

            } else {

                alert("Please log in to save an internship.");

                window.location.href = "login.html";

            }

        });


        // Save internship

        form.addEventListener("submit", async (event) => {

            event.preventDefault();


            if (!currentUser) {

                message.textContent =
                    "Please wait for login verification.";

                message.className = "message error";

                return;

            }


            const title = document
                .getElementById("title")
                .value
                .trim();

            const company = document
                .getElementById("company")
                .value
                .trim();

            const location = document
                .getElementById("location")
                .value
                .trim();

            const workMode = document
                .getElementById("workMode")
                .value;

            const stipend = document
                .getElementById("stipend")
                .value
                .trim();

            const applicationLink = document
                .getElementById("applicationLink")
                .value
                .trim();

            const deadline = document
                .getElementById("deadline")
                .value;

            const status = document
                .getElementById("status")
                .value;

            const notes = document
                .getElementById("notes")
                .value
                .trim();


            // Check application URL

            try {

                const url = new URL(applicationLink);

                if (
                    url.protocol !== "http:" &&
                    url.protocol !== "https:"
                ) {

                    throw new Error("Invalid protocol");

                }

            } catch (error) {

                message.textContent =
                    "Please enter a valid application link starting with https://";

                message.className = "message error";

                return;

            }


            saveButton.disabled = true;

            saveButton.textContent = "Saving...";

            message.textContent = "";


            try {

                const internshipsCollection = collection(
                    db,
                    "users",
                    currentUser.uid,
                    "internships"
                );


                await addDoc(
                    internshipsCollection,
                    {

                        title: title,

                        company: company,

                        location: location,

                        workMode: workMode,

                        stipend: stipend,

                        applicationLink: applicationLink,

                        deadline: deadline,

                        status: status,

                        notes: notes,

                        userId: currentUser.uid,

                        createdAt: serverTimestamp(),

                        updatedAt: serverTimestamp()

                    }
                );


                message.textContent =
                    "Internship saved successfully! 🎉";

                message.className = "message success";

                form.reset();


                setTimeout(() => {

                    window.location.href =
                        "saved-internships.html";

                }, 1200);


            } catch (error) {

                console.error(
                    "Error saving internship:",
                    error
                );

                message.textContent =
                    "Unable to save internship. Please try again.";

                message.className = "message error";

            } finally {

                saveButton.disabled = false;

                saveButton.textContent =
                    "Save Internship 💾";

            }

        });

    </script>

</body>

</html>
