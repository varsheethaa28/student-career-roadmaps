<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | CareerPath</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #fff5f6, #ffffff);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #172033;
        }

        .container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }

        .logo {
            text-align: center;
            color: #d90429;
            font-size: 30px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #737b8c;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 32px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
            border: 1px solid #eeeeee;
        }

        .card h1 {
            text-align: center;
            font-size: 25px;
            margin-bottom: 8px;
        }

        .card-description {
            text-align: center;
            color: #777f90;
            font-size: 13px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: #3e4758;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #dfe3e8;
            border-radius: 9px;
            outline: none;
            font-size: 14px;
            transition: 0.2s;
        }

        input:focus {
            border-color: #d90429;
            box-shadow: 0 0 0 3px rgba(217, 4, 41, 0.08);
        }

        .register-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 9px;
            background: #d90429;
            color: white;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 5px;
        }

        .register-btn:hover {
            background: #b90323;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 22px 0;
            color: #9aa1ae;
            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #e5e7eb;
        }

        /* GOOGLE BUTTON */

        .google-btn {
            width: 100%;
            min-height: 52px;
            background: white;
            border: 1px solid #d9dee7;
            border-radius: 10px;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;

            color: #202124;
            font-size: 15px;
            font-weight: 600;

            cursor: pointer;
            transition: 0.2s;
        }

        .google-btn:hover {
            background: #f8f9fa;
            border-color: #c7ccd5;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .google-icon {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        .login-text {
            text-align: center;
            margin-top: 22px;
            color: #737b8c;
            font-size: 13px;
        }

        .login-text a {
            color: #d90429;
            font-weight: 700;
            text-decoration: none;
        }

        .login-text a:hover {
            text-decoration: underline;
        }

        #message {
            text-align: center;
            font-size: 13px;
            margin-top: 15px;
            line-height: 1.5;
        }

        .error {
            color: #d90429;
        }

        .success {
            color: #159947;
        }

        .login-now {
            display: inline-block;
            margin-top: 8px;
            color: #d90429;
            font-weight: 700;
            text-decoration: none;
        }

        @media (max-width: 500px) {
            .container {
                padding: 15px;
            }

            .card {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        CareerPath
    </div>

    <div class="subtitle">
        Build your career. Discover your path.
    </div>

    <div class="card">

        <h1>Create Account</h1>

        <p class="card-description">
            Start building your personalized career journey.
        </p>


        <!-- REGISTER FORM -->

        <form id="registerForm">

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter your username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    minlength="6"
                    required
                >

            </div>


            <button
                type="submit"
                class="register-btn"
            >
                Create Account
            </button>

        </form>


        <div class="divider">
            OR
        </div>


        <!-- GOOGLE SIGN IN -->

        <button
            type="button"
            class="google-btn"
            id="googleBtn"
        >

            <!-- OFFICIAL GOOGLE G SVG -->

            <svg
                class="google-icon"
                viewBox="0 0 24 24"
                xmlns="http://www.w3.org/2000/svg"
            >

                <path
                    fill="#4285F4"
                    d="M21.35 12.27c0-.79-.07-1.55-.22-2.27H12v4.3h5.22a4.46 4.46 0 0 1-1.94 2.93v2.44h3.14c1.84-1.69 2.93-4.18 2.93-7.4z"
                />

                <path
                    fill="#34A853"
                    d="M12 21.96c2.63 0 4.84-.87 6.45-2.36l-3.14-2.44c-.87.58-1.98.93-3.31.93-2.54 0-4.69-1.72-5.46-4.03H3.3v2.52A9.75 9.75 0 0 0 12 21.96z"
                />

                <path
                    fill="#FBBC05"
                    d="M6.54 14.06a5.86 5.86 0 0 1 0-3.74V7.8H3.3a9.98 9.98 0 0 0 0 8.78l3.24-2.52z"
                />

                <path
                    fill="#EA4335"
                    d="M12 6.29c1.43 0 2.72.49 3.73 1.45l2.8-2.8C16.84 3.33 14.63 2.4 12 2.4a9.75 9.75 0 0 0-8.7 5.4l3.24 2.52C7.31 8.01 9.46 6.29 12 6.29z"
                />

            </svg>

            Continue with Google

        </button>


        <!-- MESSAGE -->

        <div id="message"></div>


        <!-- LOGIN -->

        <div class="login-text">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </div>

    </div>

</div>


<!-- ================= FIREBASE ================= -->

<script type="module">

    import {
        auth
    } from "../frontend/firebase-config.js";

    import {
        createUserWithEmailAndPassword,
        GoogleAuthProvider,
        signInWithPopup
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


    const registerForm =
        document.getElementById("registerForm");

    const googleBtn =
        document.getElementById("googleBtn");

    const message =
        document.getElementById("message");


    /* ================= EMAIL REGISTER ================= */

    registerForm.addEventListener(
        "submit",
        async (event) => {

            event.preventDefault();


            const username =
                document
                    .getElementById("username")
                    .value
                    .trim();


            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("password")
                    .value;


            message.textContent =
                "Creating your account...";

            message.className = "";


            try {

                await createUserWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


                message.textContent =
                    "✅ Account created successfully! Redirecting...";

                message.className =
                    "success";


                setTimeout(() => {

                    window.location.href =
                        "dashboard.html";

                }, 1000);


            } catch (error) {

                console.error(error);


                if (
                    error.code ===
                    "auth/email-already-in-use"
                ) {

                    message.innerHTML = `
                        This email is already registered.
                        <br>
                        <a class="login-now" href="login.html">
                            Login Now →
                        </a>
                    `;

                    message.className =
                        "error";

                } else if (
                    error.code ===
                    "auth/weak-password"
                ) {

                    message.textContent =
                        "Password must contain at least 6 characters.";

                    message.className =
                        "error";

                } else if (
                    error.code ===
                    "auth/invalid-email"
                ) {

                    message.textContent =
                        "Please enter a valid email address.";

                    message.className =
                        "error";

                } else {

                    message.textContent =
                        "❌ " + error.message;

                    message.className =
                        "error";

                }

            }

        }
    );


    /* ================= GOOGLE REGISTER ================= */

    googleBtn.addEventListener(
        "click",
        async () => {

            message.textContent =
                "Opening Google sign-in...";

            message.className = "";


            try {

                const provider =
                    new GoogleAuthProvider();


                await signInWithPopup(
                    auth,
                    provider
                );


                message.textContent =
                    "✅ Google sign-in successful! Redirecting...";

                message.className =
                    "success";


                setTimeout(() => {

                    window.location.href =
                        "dashboard.html";

                }, 800);


            } catch (error) {

                console.error(error);


                if (
                    error.code ===
                    "auth/popup-closed-by-user"
                ) {

                    message.textContent =
                        "Google sign-in was cancelled.";

                } else if (
                    error.code ===
                    "auth/unauthorized-domain"
                ) {

                    message.textContent =
                        "This website domain is not authorized in Firebase.";

                } else {

                    message.textContent =
                        "❌ " + error.message;

                }

                message.className =
                    "error";

            }

        }
    );

</script>

</body>
</html>
