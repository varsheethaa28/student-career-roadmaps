<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | CareerPath</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #fff5f6, #ffffff);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #172033;
        }

        .container {
            width: 100%;
            max-width: 650px;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 45px 50px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.07);
            border: 1px solid #eeeeee;
        }

        .welcome {
            color: #d90429;
            font-size: 23px;
            font-weight: 700;
            margin-bottom: 30px;
        }

        .welcome span {
            display: inline-block;
            width: 68px;
            height: 5px;
            background: #f5223d;
            border-radius: 10px;
            margin-top: 18px;
            display: block;
        }

        h1 {
            font-size: 38px;
            margin-bottom: 20px;
            color: #071b42;
        }

        .subtitle {
            color: #788196;
            font-size: 18px;
            margin-bottom: 38px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 19px 20px;
            border: 1px solid #dce1e9;
            border-radius: 15px;
            outline: none;
            font-size: 18px;
            color: #172033;
        }

        input:focus {
            border-color: #d90429;
            box-shadow: 0 0 0 3px rgba(217, 4, 41, 0.08);
        }

        .login-btn {
            width: 100%;
            padding: 20px;
            border: none;
            border-radius: 15px;
            background: linear-gradient(
                90deg,
                #f5223d,
                #e4002b
            );
            color: white;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 2px;
        }

        .login-btn:hover {
            opacity: 0.93;
        }

        /* FORGOT PASSWORD */

        .forgot-container {
            text-align: right;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        .forgot-btn {
            border: none;
            background: none;
            color: #d90429;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .forgot-btn:hover {
            text-decoration: underline;
        }

        .reset-box {
            display: none;
            background: #fff7f8;
            border: 1px solid #ffdce1;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 20px;
        }

        .reset-box.active {
            display: block;
        }

        .reset-box p {
            color: #687286;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .reset-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 9px;
            background: #d90429;
            color: white;
            font-weight: 700;
            cursor: pointer;
        }

        /* DIVIDER */

        .divider {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 30px 0;
            color: #8a93a3;
            font-size: 15px;
        }

        .divider::before,
        .divider::after {
            content: "";
            height: 1px;
            background: #dfe3e9;
            flex: 1;
        }

        /* GOOGLE BUTTON */

        .google-btn {
            width: 100%;
            min-height: 68px;

            background: white;

            border: 1px solid #d9dee7;

            border-radius: 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 10px;

            color: #202124;

            font-size: 18px;
            font-weight: 600;

            cursor: pointer;

            transition: 0.2s;
        }

        .google-btn:hover {
            background: #f8f9fa;
            border-color: #c5cad3;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.07);
        }

        .google-icon {
            width: 21px;
            height: 21px;
            flex-shrink: 0;
        }

        /* REGISTER */

        .register-text {
            text-align: center;
            margin-top: 32px;
            color: #7b8495;
            font-size: 17px;
        }

        .register-text a {
            color: #f5223d;
            font-weight: 700;
            text-decoration: none;
        }

        .register-text a:hover {
            text-decoration: underline;
        }

        /* MESSAGE */

        #message {
            text-align: center;
            font-size: 14px;
            line-height: 1.5;
            margin-top: 16px;
        }

        .success {
            color: #159947;
        }

        .error {
            color: #d90429;
        }

        @media (max-width: 650px) {

            .container {
                padding: 12px;
            }

            .card {
                padding: 30px 22px;
            }

            h1 {
                font-size: 30px;
            }

            .subtitle {
                font-size: 16px;
            }

            input {
                font-size: 16px;
                padding: 16px;
            }

            .login-btn {
                font-size: 17px;
                padding: 17px;
            }

            .google-btn {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <!-- WELCOME -->

        <div class="welcome">

            👋 Welcome Back

            <span></span>

        </div>


        <h1>
            Login to Your Account
        </h1>


        <p class="subtitle">
            Continue your journey towards a better future.
        </p>


        <!-- LOGIN FORM -->

        <form id="loginForm">

            <div class="form-group">

                <input
                    type="email"
                    id="email"
                    placeholder="Email address"
                    required
                >

            </div>


            <div class="form-group">

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >

            </div>


            <!-- FORGOT PASSWORD -->

            <div class="forgot-container">

                <button
                    type="button"
                    class="forgot-btn"
                    id="forgotBtn"
                >
                    Forgot Password?
                </button>

            </div>


            <!-- RESET BOX -->

            <div
                class="reset-box"
                id="resetBox"
            >

                <p>
                    Enter your email address and we'll send
                    you a password reset link.
                </p>

                <button
                    type="button"
                    class="reset-btn"
                    id="resetBtn"
                >
                    Send Reset Email
                </button>

            </div>


            <button
                type="submit"
                class="login-btn"
            >
                Login →
            </button>

        </form>


        <!-- DIVIDER -->

        <div class="divider">
            OR
        </div>


        <!-- GOOGLE LOGIN -->

        <button
            type="button"
            class="google-btn"
            id="googleBtn"
        >

            <!-- REAL GOOGLE MULTICOLOR G -->

            <svg
                class="google-icon"
                viewBox="0 0 24 24"
                xmlns="http://www.w3.org/2000/svg"
            >

                <path
                    fill="#4285F4"
                    d="M21.35 12.27c0-.79-.07-1.55-.22-2.27H12v4.3h5.22a4.46 4.46 0 0 1-1.94 2.93v2.44h3.14c1.84-1.69 2.93-4.18 2.93-7.4z"
                />

                <path
                    fill="#34A853"
                    d="M12 21.96c2.63 0 4.84-.87 6.45-2.36l-3.14-2.44c-.87.58-1.98.93-3.31.93-2.54 0-4.69-1.72-5.46-4.03H3.3v2.52A9.75 9.75 0 0 0 12 21.96z"
                />

                <path
                    fill="#FBBC05"
                    d="M6.54 14.06a5.86 5.86 0 0 1 0-3.74V7.8H3.3a9.98 9.98 0 0 0 0 8.78l3.24-2.52z"
                />

                <path
                    fill="#EA4335"
                    d="M12 6.29c1.43 0 2.72.49 3.73 1.45l2.8-2.8C16.84 3.33 14.63 2.4 12 2.4a9.75 9.75 0 0 0-8.7 5.4l3.24 2.52C7.31 8.01 9.46 6.29 12 6.29z"
                />

            </svg>

            Continue with Google

        </button>


        <!-- MESSAGE -->

        <div id="message"></div>


        <!-- REGISTER -->

        <div class="register-text">

            Don't have an account?

            <a href="register.html">
                Register →
            </a>

        </div>

    </div>

</div>


<!-- ================= FIREBASE ================= -->

<script type="module">

    import {
        auth
    } from "../frontend/firebase-config.js";


    import {
        signInWithEmailAndPassword,
        sendPasswordResetEmail,
        GoogleAuthProvider,
        signInWithPopup
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


    const loginForm =
        document.getElementById("loginForm");

    const googleBtn =
        document.getElementById("googleBtn");

    const forgotBtn =
        document.getElementById("forgotBtn");

    const resetBtn =
        document.getElementById("resetBtn");

    const resetBox =
        document.getElementById("resetBox");

    const message =
        document.getElementById("message");


    /* ================= EMAIL LOGIN ================= */

    loginForm.addEventListener(
        "submit",
        async (event) => {

            event.preventDefault();


            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("password")
                    .value;


            message.textContent =
                "Logging in...";

            message.className = "";


            try {

                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


                message.textContent =
                    "✅ Login successful! Redirecting...";

                message.className =
                    "success";


                setTimeout(() => {

                    window.location.href =
                        "dashboard.html";

                }, 700);


            } catch (error) {

                console.error(error);


                if (
                    error.code ===
                    "auth/invalid-credential" ||
                    error.code ===
                    "auth/wrong-password"
                ) {

                    message.textContent =
                        "Incorrect email or password.";

                } else if (
                    error.code ===
                    "auth/user-not-found"
                ) {

                    message.textContent =
                        "No account found with this email.";

                } else if (
                    error.code ===
                    "auth/invalid-email"
                ) {

                    message.textContent =
                        "Please enter a valid email.";

                } else {

                    message.textContent =
                        "❌ " + error.message;

                }

                message.className =
                    "error";

            }

        }
    );


    /* ================= FORGOT PASSWORD ================= */

    forgotBtn.addEventListener(
        "click",
        () => {

            resetBox.classList.toggle(
                "active"
            );

            message.textContent = "";

        }
    );


    /* ================= RESET PASSWORD ================= */

    resetBtn.addEventListener(
        "click",
        async () => {

            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();


            if (!email) {

                message.textContent =
                    "Please enter your email address first.";

                message.className =
                    "error";

                return;

            }


            message.textContent =
                "Sending reset email...";

            message.className = "";


            try {

                await sendPasswordResetEmail(
                    auth,
                    email
                );


                message.textContent =
                    "✅ Password reset email sent. Please check your inbox and Spam folder.";

                message.className =
                    "success";


            } catch (error) {

                console.error(error);


                if (
                    error.code ===
                    "auth/user-not-found"
                ) {

                    message.textContent =
                        "No account found with this email.";

                } else if (
                    error.code ===
                    "auth/invalid-email"
                ) {

                    message.textContent =
                        "Please enter a valid email.";

                } else {

                    message.textContent =
                        "❌ " + error.message;

                }

                message.className =
                    "error";

            }

        }
    );


    /* ================= GOOGLE LOGIN ================= */

    googleBtn.addEventListener(
        "click",
        async () => {

            message.textContent =
                "Opening Google sign-in...";

            message.className = "";


            try {

                const provider =
                    new GoogleAuthProvider();


                await signInWithPopup(
                    auth,
                    provider
                );


                message.textContent =
                    "✅ Google login successful! Redirecting...";

                message.className =
                    "success";


                setTimeout(() => {

                    window.location.href =
                        "dashboard.html";

                }, 700);


            } catch (error) {

                console.error(error);


                if (
                    error.code ===
                    "auth/popup-closed-by-user"
                ) {

                    message.textContent =
                        "Google sign-in was cancelled.";

                } else if (
                    error.code ===
                    "auth/unauthorized-domain"
                ) {

                    message.textContent =
                        "This website domain is not authorized in Firebase.";

                } else {

                    message.textContent =
                        "❌ " + error.message;

                }

                message.className =
                    "error";

            }

        }
    );

</script>

</body>
</html>
