<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | CareerPath</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f8f8f8;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .logo {
            text-align: center;
            margin-bottom: 10px;
            color: #d90429;
            font-size: 32px;
            font-weight: bold;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 600;
            color: #333;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #ddd;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #d90429;
        }

        .forgot-container {
            display: flex;
            justify-content: flex-end;
            margin-top: -8px;
            margin-bottom: 20px;
        }

        #forgotPassword {
            background: transparent;
            border: none;
            outline: none;
            padding: 0;
            color: #d90429;
            font-size: 14px;
            cursor: pointer;
        }

        #forgotPassword:hover {
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: #d90429;
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #b90322;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 25px 0;
            color: #999;
            font-size: 14px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #ddd;
        }

        .google-btn {
            width: 100%;
            padding: 12px;
            background: white;
            color: #333;
            border: 1px solid #ddd;
            border-radius: 9px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;

            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .google-btn:hover {
            background: #f7f7f7;
        }

        .google-icon {
            width: 20px;
            height: 20px;
        }

        .register-text {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: #666;
        }

        .register-text a {
            color: #d90429;
            text-decoration: none;
            font-weight: bold;
        }

        .register-text a:hover {
            text-decoration: underline;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            line-height: 1.5;
            min-height: 20px;
        }

        .success {
            color: #16803c;
        }

        .error {
            color: #d90429;
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="logo">
            CareerPath
        </div>

        <p class="subtitle">
            Login to continue your career journey
        </p>


        <!-- ========================= -->
        <!-- LOGIN FORM -->
        <!-- ========================= -->

        <form id="loginForm">

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <!-- FORGOT PASSWORD -->

            <div class="forgot-container">

                <button
                    type="button"
                    id="forgotPassword"
                >
                    Forgot Password?
                </button>

            </div>


            <!-- LOGIN -->

            <button
                type="submit"
                class="login-btn"
            >
                Login
            </button>

        </form>


        <!-- DIVIDER -->

        <div class="divider">
            OR
        </div>


        <!-- ========================= -->
        <!-- GOOGLE LOGIN -->
        <!-- ========================= -->

        <button
            type="button"
            id="googleLogin"
            class="google-btn"
        >

            <svg
                class="google-icon"
                viewBox="0 0 24 24"
                xmlns="http://www.w3.org/2000/svg"
            >

                <path
                    fill="#4285F4"
                    d="M21.35 12.27c0-.79-.07-1.55-.2-2.27H12v4.3h5.23a4.47 4.47 0 0 1-1.94 2.93v2.44h3.14c1.84-1.69 2.92-4.18 2.92-7.4z"
                />

                <path
                    fill="#34A853"
                    d="M12 21.5c2.63 0 4.84-.87 6.45-2.36l-3.14-2.44c-.87.58-1.98.92-3.31.92-2.54 0-4.69-1.72-5.46-4.03H3.3v2.52A9.74 9.74 0 0 0 12 21.5z"
                />

                <path
                    fill="#FBBC05"
                    d="M6.54 13.59A5.86 5.86 0 0 1 6.23 12c0-.55.11-1.09.31-1.59V7.89H3.3A9.73 9.73 0 0 0 2.27 12c0 1.57.38 3.05 1.03 4.11l3.24-2.52z"
                />

                <path
                    fill="#EA4335"
                    d="M12 6.38c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.84 3.39 14.63 2.5 12 2.5a9.74 9.74 0 0 0-8.7 5.39l3.24 2.52C7.31 8.1 9.46 6.38 12 6.38z"
                />

            </svg>

            Continue with Google

        </button>


        <!-- MESSAGE -->

        <div id="message"></div>


        <!-- REGISTER -->

        <p class="register-text">

            Don't have an account?

            <a href="register.html">
                Create Account
            </a>

        </p>

    </div>

</div>


<!-- ========================= -->
<!-- FIREBASE -->
<!-- ========================= -->

<script type="module">

    import {
        getAuth,
        signInWithEmailAndPassword,
        GoogleAuthProvider,
        signInWithPopup,
        sendPasswordResetEmail
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


    import {
        app
    } from "../frontend/firebase-config.js";


    // Firebase Authentication

    const auth = getAuth(app);

    const provider = new GoogleAuthProvider();


    // Elements

    const loginForm =
        document.getElementById("loginForm");

    const googleLogin =
        document.getElementById("googleLogin");

    const forgotPassword =
        document.getElementById("forgotPassword");

    const emailInput =
        document.getElementById("email");

    const passwordInput =
        document.getElementById("password");

    const message =
        document.getElementById("message");


    // =========================
    // MESSAGE FUNCTION
    // =========================

    function showMessage(text, type) {

        message.textContent = text;

        message.className = type;

    }


    // =========================
    // EMAIL LOGIN
    // =========================

    loginForm.addEventListener(
        "submit",
        async (event) => {

            event.preventDefault();

            const email =
                emailInput.value.trim();

            const password =
                passwordInput.value;


            if (!email || !password) {

                showMessage(
                    "Please enter your email and password.",
                    "error"
                );

                return;
            }


            showMessage(
                "Logging in...",
                ""
            );


            try {

                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


                showMessage(
                    "Login successful!",
                    "success"
                );


                setTimeout(() => {

                    window.location.href =
                        "dashboard.html";

                }, 800);


            } catch (error) {

                console.error(
                    "Login error:",
                    error
                );


                if (
                    error.code ===
                    "auth/invalid-credential"
                ) {

                    showMessage(
                        "Incorrect email or password.",
                        "error"
                    );

                }

                else if (
                    error.code ===
                    "auth/user-not-found"
                ) {

                    showMessage(
                        "No account found with this email.",
                        "error"
                    );

                }

                else if (
                    error.code ===
                    "auth/wrong-password"
                ) {

                    showMessage(
                        "Incorrect password.",
                        "error"
                    );

                }

                else {

                    showMessage(
                        error.message,
                        "error"
                    );

                }

            }

        }
    );


    // =========================
    // GOOGLE LOGIN
    // =========================

    googleLogin.addEventListener(
        "click",
        async () => {

            showMessage(
                "Opening Google sign-in...",
                ""
            );


            try {

                await signInWithPopup(
                    auth,
                    provider
                );


                showMessage(
                    "Google login successful!",
                    "success"
                );


                setTimeout(() => {

                    window.location.href =
                        "dashboard.html";

                }, 800);


            } catch (error) {

                console.error(
                    "Google login error:",
                    error
                );


                showMessage(
                    error.message,
                    "error"
                );

            }

        }
    );


    // =========================
    // FORGOT PASSWORD
    // =========================

    forgotPassword.addEventListener(
        "click",
        async () => {

            const email =
                emailInput.value.trim();


            // Email required

            if (!email) {

                showMessage(
                    "Please enter your email address first.",
                    "error"
                );

                emailInput.focus();

                return;
            }


            // Check email format

            if (
                !email.includes("@") ||
                !email.includes(".")
            ) {

                showMessage(
                    "Please enter a valid email address.",
                    "error"
                );

                emailInput.focus();

                return;
            }


            showMessage(
                "Sending password reset email...",
                ""
            );


            try {

                await sendPasswordResetEmail(
                    auth,
                    email
                );


                showMessage(
                    "Password reset email sent! Check your inbox or spam folder.",
                    "success"
                );


            } catch (error) {

                console.error(
                    "Password reset error:",
                    error
                );


                if (
                    error.code ===
                    "auth/user-not-found"
                ) {

                    showMessage(
                        "No account found with this email.",
                        "error"
                    );

                }

                else if (
                    error.code ===
                    "auth/invalid-email"
                ) {

                    showMessage(
                        "Please enter a valid email address.",
                        "error"
                    );

                }

                else if (
                    error.code ===
                    "auth/too-many-requests"
                ) {

                    showMessage(
                        "Too many requests. Please try again later.",
                        "error"
                    );

                }

                else {

                    showMessage(
                        error.message,
                        "error"
                    );

                }

            }

        }
    );

</script>

</body>
</html>
